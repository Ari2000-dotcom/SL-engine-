[workspace]
resolver = "2"
members = ["crates/core", "crates/brokers", "crates/store", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
sl-core = { path = "crates/core" }
sl-brokers = { path = "crates/brokers" }
sl-store = { path = "crates/store" }

[profile.release]
lto = "thin"
codegen-units = 1
